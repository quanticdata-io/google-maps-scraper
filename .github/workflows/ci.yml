name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[browser]" --group dev
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync mypy
      - name: Tests (browser tests run in their own job)
        run: uv run --no-sync pytest -m "not browser" --cov=gmaps_places --cov-report=term

  browser:
    name: Browser end-to-end (synthetic local site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[browser]" --group dev
          uv run --no-sync playwright install --with-deps chromium
      - name: Browser tests
        run: uv run --no-sync pytest -m browser -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check dist/*
