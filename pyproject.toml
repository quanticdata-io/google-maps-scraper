[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gmaps-places-scraper"
version = "0.1.0"
description = "Google Maps places scraper: CLI and Python library with a maintained QuanticData API engine and a local Playwright engine, grid search, email enrichment and CSV/JSON/JSONL export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = [
  "google-maps",
  "google-maps-scraper",
  "places",
  "local-business",
  "lead-generation",
  "scraper",
  "web-scraping",
  "playwright",
  "quanticdata",
  "csv",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
browser = ["playwright>=1.45", "beautifulsoup4>=4.12"]

[project.scripts]
gmaps-places = "gmaps_places.cli:main"

[project.urls]
Homepage = "https://github.com/quanticdata-io/google-maps-scraper"
Documentation = "https://github.com/quanticdata-io/google-maps-scraper#readme"
Issues = "https://github.com/quanticdata-io/google-maps-scraper/issues"
Changelog = "https://github.com/quanticdata-io/google-maps-scraper/blob/main/CHANGELOG.md"
"API reference" = "https://quanticdata.io/docs/"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "mypy>=1.13",
  "ruff>=0.8",
  "build>=1.2",
  "twine>=5.1",
  "beautifulsoup4>=4.12",
  "playwright>=1.45",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gmaps_places"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "RET"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]
"tests/test_browser.py" = ["E501"]  # inline HTML and JS of the synthetic site

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: needs Playwright and a Chromium build (skipped when unavailable)"]
